name: Repository Consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  consistency:
    name: Repository consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:base-devel
    steps:
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if pacman -Syyu --noconfirm bubblewrap git jq npm python python-fastapi python-sqlalchemy python-aiosqlite python-bcrypt python-packaging python-requests python-typer python-yaml rsync uv uvicorn zsh; then
              break
            fi
            if [[ "${attempt}" == 4 ]]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify required test tools
        shell: bash
        run: |
          set -euo pipefail
          for command in bsdtar bwrap git makepkg npm python3 repo-add repo-remove rsync uv zsh zstd; do
            command -v "${command}"
          done
          python3 -c 'import fastapi, packaging, requests, typer, uvicorn, yaml'

      - name: Run repository consistency gate
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash consistency
          chown -R consistency:consistency "${GITHUB_WORKSPACE}"
          runuser -u consistency -- \
            env HOME=/home/consistency \
            python3 tools/check_repo_consistency.py

  service-tls:
    name: Service TLS clients
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:base-devel
    steps:
      - name: Install TLS test tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if pacman -Syyu --noconfirm curl git jq openssl python uv zsh; then
              break
            fi
            if [[ "${attempt}" == 4 ]]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Exercise pinned clients against disposable TLS peers
        shell: bash
        run: |
          set -euo pipefail
          for command in curl jq openssl patch python3 uv zsh; do
            command -v "${command}"
          done
          useradd --create-home --shell /bin/bash tls-tests
          chown -R tls-tests:tls-tests "${GITHUB_WORKSPACE}"
          runuser -u tls-tests -- env HOME=/home/tls-tests bash <<'EOF'
          set -euo pipefail
          uv venv /home/tls-tests/venv
          # Use the same direct client versions as the package's private lock.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          names = {"qdrant-client", "redis", "python-socketio", "starsessions"}
          requirements = [
              line.split()[0]
              for line in Path("packages/open-webui/open-webui-private-requirements.lock").read_text().splitlines()
              if line.partition("==")[0] in names
          ]
          if len(requirements) != len(names):
              raise SystemExit("missing or duplicate pinned TLS client requirements")
          subprocess.run([
              "uv", "pip", "install", "--python", "/home/tls-tests/venv/bin/python",
              *requirements,
          ], check=True)
          PY
          /home/tls-tests/venv/bin/python -c 'import qdrant_client, redis, socketio, starsessions'
          /home/tls-tests/venv/bin/python -m unittest \
            tests.test_open_webui_service_tls tests.test_qdrant_cutover_tls -v
          EOF

      - name: Exercise protected TLS identity lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -eq 0
          command -v openssl
          # This module uses disposable directories only. Root is required to
          # exercise ownership checks; it does not operate on host services.
          python3 -m unittest tests.test_local_service_tls_lifecycle -v
